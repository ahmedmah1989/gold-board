name: Refresh verified public quotes
on:
  push:
    branches: [main]
    paths: ['index.html', '**.js', '**.py', 'tests/fixtures/**', '.github/workflows/quotes.yml']
  pull_request:
    paths: ['**.js', '**.py', 'tests/fixtures/**', '.github/workflows/quotes.yml']
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    concurrency:
      group: gold-board-validate-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -p 'test_*.py'
      - run: node monitor.test.js && node analytics.test.js && node alerts.test.js && node services.test.js
  collect:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Only the collector is serialized. The publication proof runs in its own job so a slow
    # Pages build cannot hold the next 5-minute collection back.
    concurrency:
      group: gold-board-quotes-main
      cancel-in-progress: false
    outputs:
      generated_at: ${{ steps.generated.outputs.generated_at }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          # Always collect on the live tip of main. The default event SHA is
          # stale when an earlier run pushed while this run was queued/running,
          # which made the Save step's pull --rebase conflict on every race.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -p 'test_*.py'
      - run: node monitor.test.js
      - run: node analytics.test.js
      - run: node alerts.test.js
      - run: node services.test.js
      - name: Preserve previous collection time
        run: python -c 'import json,pathlib; p=pathlib.Path("data/quotes.json"); pathlib.Path("data/previous-collection-time.txt").write_text(json.loads(p.read_text()).get("generatedAt", "") if p.exists() else "")'
      - name: Collect current prices and optional free API cross-check
        env:
          GOLDTIMO_API_KEY: ${{ secrets.GOLDTIMO_API_KEY }}
        run: python collect.py
      - run: python local_history.py
      - run: python store_offers.py
      - run: python collection_health.py
      - run: python audit_checks.py
      - run: node audit_snapshot.test.js
      - name: Verify Telegram connection and evaluate conditional alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_telegram.py
      - name: Save latest source observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/quotes.json data/alert-state.json data/offers.json data/history.json data/audit.json data/local-history.json data/collection-health.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh timestamped public source quotes'
            # Guard: integrate anything pushed during this run. On conflict,
            # abort and FAIL LOUDLY: the next scheduled run recollects on a
            # fresh base. Never resolve with -X theirs (silent data loss).
            if ! git pull --rebase; then
              git rebase --abort
              echo 'Save step: rebase conflict; failing loudly so the next run recollects fresh.' >&2
              exit 1
            fi
            # Bounded push retry: one extra fetch+rebase for a non-fast-forward.
            if ! git push; then
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo 'Save step: concurrent update on retry; failing loudly.' >&2
                exit 1
              fi
              git push
            fi
          fi
      - name: Rebuild branch-based GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Bounded retry: the API intermittently returns an empty body, which
          # gh fails to parse as JSON ("unexpected end of JSON input").
          ok=0
          for i in 1 2 3; do
            if gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"; then ok=1; break; fi
            echo "pages/builds attempt $i failed; retrying in $((i*10))s" >&2
            sleep $((i*10))
          done
          if [ "$ok" -ne 1 ]; then
            echo 'pages/builds failed after 3 attempts; failing loudly.' >&2
            exit 1
          fi
      - name: Record the generation time this run published
        id: generated
        run: python -c 'import json; print("generated_at=" + json.load(open("data/quotes.json"))["generatedAt"])' >> "$GITHUB_OUTPUT"
      - name: Daily history maintenance after current-price publication
        run: |
          python history_collect.py
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh daily historical references'
            if ! git pull --rebase; then
              git rebase --abort
              echo 'History step: rebase conflict; failing loudly so the next run recollects fresh.' >&2
              exit 1
            fi
            git push
            ok=0
            for i in 1 2 3; do
              if gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"; then ok=1; break; fi
              echo "pages/builds attempt $i failed; retrying in $((i*10))s" >&2
              sleep $((i*10))
            done
            if [ "$ok" -ne 1 ]; then
              echo 'pages/builds failed after 3 attempts; failing loudly.' >&2
              exit 1
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}
  verify:
    needs: collect
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove published primary-quote freshness and signal independent monitor
        env:
          EXPECTED_GENERATED_AT: ${{ needs.collect.outputs.generated_at }}
          FRESHNESS_HEARTBEAT_URL: ${{ secrets.FRESHNESS_HEARTBEAT_URL }}
        run: python published_health.py
