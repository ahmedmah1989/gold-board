name: Refresh verified public quotes
on:
  push:
    branches: [main]
    paths: ['index.html', 'monitor.js', 'analytics.js', 'analytics.test.js', 'collect.py', 'test_collect.py', '.github/workflows/quotes.yml']
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: gold-board-quotes
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -p 'test_*.py'
      - run: node monitor.test.js
      - run: node analytics.test.js
      - run: python collect.py
      - name: Save latest source observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/quotes.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh timestamped public source quotes'
            git pull --rebase
            git push
          fi
      - name: Rebuild branch-based GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
